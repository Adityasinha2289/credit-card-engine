<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    </noscript>

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Viewport & Theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1F15" />
    <style>html,body{background:#0A1F15}</style>
    <!-- The loading screen. It lives here, not in the app, so it is on screen from the
         first frame of a signed-in page (before any JavaScript) and is never rebuilt;
         src/lib/bootLoader.ts only shows and hides this element. -->
    <style>
      #rc-loader{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:#0A1F15;opacity:0;visibility:hidden;transition:opacity 340ms cubic-bezier(.22,1,.36,1),visibility 0s linear 340ms}
      #rc-loader.rc-on{opacity:1;visibility:visible;transition:opacity 340ms cubic-bezier(.22,1,.36,1),visibility 0s}
      #rc-loader.rc-instant{transition:none}
      #rc-loader .rc-glow{position:absolute;width:460px;height:460px;border-radius:50%;background:radial-gradient(closest-side,rgba(227,238,212,.08),transparent);pointer-events:none}
      #rc-loader .rc-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px}
      #rc-loader .rc-ring{position:relative;width:76px;height:76px}
      #rc-loader .rc-ring svg{position:absolute;left:0;top:0}
      #rc-loader .rc-arc{transform-origin:38px 38px;animation:rc-spin 1.1s linear infinite}
      #rc-loader .rc-ring .rc-mark{left:50%;top:50%;transform:translate(-50%,-50%)}
      #rc-loader .rc-mark path{stroke-dasharray:100;stroke-dashoffset:100;animation:rc-draw 2.4s cubic-bezier(.65,0,.35,1) infinite}
      #rc-loader .rc-mark path+path{animation-delay:.16s}
      #rc-loader .rc-name{font:600 11px/1 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.34em;text-indent:.34em;color:rgba(174,195,176,.75)}
      #rc-loader .rc-slow{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px;font:500 14px/1.4 Inter,ui-sans-serif,system-ui,sans-serif;color:#AEC3B0;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;pointer-events:none}
      #rc-loader.rc-late .rc-slow{opacity:1;transform:none;pointer-events:auto}
      #rc-loader .rc-slow button{height:40px;padding:0 18px;border-radius:999px;border:0;background:#E3EED4;color:#0F2A1D;font:600 14px Inter,ui-sans-serif,system-ui,sans-serif;cursor:pointer}
      @keyframes rc-spin{to{transform:rotate(360deg)}}
      @keyframes rc-draw{0%{stroke-dashoffset:100}42%,62%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
      @media (prefers-reduced-motion:reduce){#rc-loader .rc-arc{animation-duration:3s}#rc-loader .rc-mark path{animation:none;stroke-dashoffset:0}}
    </style>

    <!-- Primary Meta Tags -->
    <title>RenoCred | The right credit card for every spend</title>
    <meta name="description" content="RenoCred has read the terms of 500+ Indian credit cards. Add the cards you own and it tells you which to swipe, tracks what you spend and reminds you before subscriptions renew." />
    <meta name="author" content="RenoCred" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://renocred.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://renocred.com/" />
    <meta property="og:title" content="RenoCred | The right credit card for every spend" />
    <meta property="og:description" content="Know which card to swipe for every spend, across 500+ Indian credit cards. Free, and never touches your credit score." />
    <meta property="og:image" content="https://renocred.com/icons/icon-512.png" />
    <meta property="og:site_name" content="RenoCred" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://renocred.com/" />
    <meta name="twitter:title" content="RenoCred | The right credit card for every spend" />
    <meta name="twitter:description" content="Know which card to swipe for every spend, across 500+ Indian credit cards. Free, and never touches your credit score." />
    <meta name="twitter:image" content="https://renocred.com/icons/icon-512.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="rc-loader" role="status" aria-label="Loading">
      <div class="rc-glow"></div>
      <div class="rc-stage">
        <div class="rc-ring">
          <svg viewBox="0 0 76 76" width="76" height="76" fill="none" aria-hidden="true">
            <circle cx="38" cy="38" r="36" stroke="rgba(227,238,212,.12)" stroke-width="1.5"/>
            <circle class="rc-arc" cx="38" cy="38" r="36" stroke="#E3EED4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="44 182"/>
          </svg>
          <svg class="rc-mark" viewBox="285 270 500 500" width="30" height="30" fill="none" aria-hidden="true">
            <path pathLength="100" d="M370 335H575A120 120 0 0 1 645.5 552" stroke="#E3EED4" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/>
            <path pathLength="100" d="M372 528L596 712" stroke="#E3EED4" stroke-width="100" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="rc-name">RENOCRED</div>
      </div>
      <div class="rc-slow"><span>This is taking longer than usual.</span><button type="button" onclick="location.reload()">Reload</button></div>
    </div>
    <script>if (location.pathname.indexOf('/app') === 0) document.getElementById('rc-loader').className = 'rc-on rc-instant';</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
